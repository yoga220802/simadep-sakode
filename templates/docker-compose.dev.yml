services:
  mysql:
    image: mysql:8.4
    container_name: simadep-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: simadep
      MYSQL_USER: simadep
      MYSQL_PASSWORD: simadep
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - simadep_mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  simadep_mysql_data:
